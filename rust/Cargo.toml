[workspace]
resolver = "2"
members = [
    "crates/a2a-types",
    "crates/a2a-server",
    "crates/a2a-client",
    "crates/a2a-echo-agent",
    "crates/a2a-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/ShuminFu/A2A"

[workspace.dependencies]
a2a-types = { path = "crates/a2a-types", version = "0.1.0" }
a2a-server = { path = "crates/a2a-server", version = "0.1.0" }
a2a-client = { path = "crates/a2a-client", version = "0.1.0" }

async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
